<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sitzplan</title>

<style>
body{
font-family:Arial;
max-width:1100px;
margin:auto;
padding:20px;
background:#f2f2f2;
}

h1{text-align:center;}

input,textarea{
width:100%;
margin-bottom:10px;
padding:6px;
font-size:16px;
}

textarea{height:140px;}

button{
margin:4px;
padding:10px;
border:none;
border-radius:8px;
background:#3a7bd5;
color:white;
}

.board{
text-align:center;
background:#333;
color:white;
padding:10px;
border-radius:6px;
margin-bottom:10px;
}

table{
width:100%;
border-spacing:4px;
table-layout:fixed;
}

td{
border:2px solid #333;
height:60px;
text-align:center;
font-weight:bold;
background:white;
cursor:grab;
}

/* 🖨️ DRUCK FIX */
@page{
size:A4 landscape;
margin:10mm;
}

@media print{

body{
background:white;
margin:0;
padding:0;
}

input,textarea,button,h1{
display:none;
}

.board{
margin:5mm 0;
}

table{
width:100%;
}

td{
height:80px;
font-size:clamp(12px,2vw,22px);
}

}
</style>
</head>

<body>

<h1>Sitzplan</h1>

<input id="classname" placeholder="Klassenname">
<textarea id="names" placeholder="Ein Name pro Zeile"></textarea>

<button onclick="generate()">Sitzplan erstellen</button>
<button onclick="toggleView()">Lehrer-/Schüleransicht</button>
<button onclick="window.print()">Drucken</button>
<button onclick="openServices()">Klassendienste</button>

<button onclick="saveFile()">Speichern</button>
<button onclick="loadFile()">Laden</button>
<input type="file" id="fileInput" style="display:none">

<div id="room"></div>

<script>

const cols=8, rows=4, total=32
let seats=[]
let mirrored=false
let dragged=null

function getData(){
return {
klasse:classname.value,
namen:names.value,
seats:seats,
stats:JSON.parse(localStorage.getItem("stats")||"{}"),
history:JSON.parse(localStorage.getItem("history")||"[]")
}
}

function setData(data){
classname.value=data.klasse||""
names.value=data.namen||""
seats=data.seats||[]
localStorage.setItem("stats",JSON.stringify(data.stats||{}))
localStorage.setItem("history",JSON.stringify(data.history||[]))
if(seats.length>0) draw()
}

function saveFile(){
let blob=new Blob([JSON.stringify(getData(),null,2)],{type:"application/json"})
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download=(classname.value||"klasse")+".json"
a.click()
}

function loadFile(){
let input=document.getElementById("fileInput")
input.onchange=function(){
let reader=new FileReader()
reader.onload=e=>setData(JSON.parse(e.target.result))
reader.readAsText(input.files[0])
}
input.click()
}

function generate(){
let arr=names.value.split("\n").map(n=>n.trim()).filter(n=>n)
arr.sort(()=>Math.random()-0.5)
seats=new Array(total).fill("")
arr.forEach((n,i)=>seats[i]=n)
draw()
}

function toggleView(){
mirrored=!mirrored
draw()
}

function draw(){

room.innerHTML=""
if(!mirrored) room.innerHTML+=`<div class="board">TAFEL</div>`

let table=document.createElement("table")

for(let r=0;r<rows;r++){
let tr=document.createElement("tr")

for(let c=0;c<cols;c++){

let i=r*cols+c
let index=mirrored ? total-1-i : i

let td=document.createElement("td")
td.textContent=seats[index]||""
td.draggable=true

td.ondragstart=()=>dragged=index
td.ondragover=e=>e.preventDefault()

td.ondrop=()=>{
let tmp=seats[index]
seats[index]=seats[dragged]
seats[dragged]=tmp
draw()
}

tr.appendChild(td)
}

table.appendChild(tr)
}

room.appendChild(table)

if(mirrored) room.innerHTML+=`<div class="board">TAFEL</div>`
}

function openServices(){
localStorage.setItem("tempData",JSON.stringify(getData()))
window.location.href="dienste.html"
}

window.onload=function(){
let data=localStorage.getItem("tempData")
if(data) setData(JSON.parse(data))
}

</script>

</body>
</html>
