<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Klassendienste</title>

<style>
body{
font-family:Arial;
max-width:900px;
margin:auto;
padding:30px;
background:#f2f2f2;
text-align:center;
}

button{
margin:8px;
padding:10px;
border:none;
border-radius:8px;
background:#3a7bd5;
color:white;
}

select{
margin-top:6px;
padding:4px;
}

.box{
background:white;
padding:15px;
margin:10px;
border-radius:10px;
font-weight:bold;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td,th{
border:1px solid #555;
padding:6px;
text-align:center;
}

td[contenteditable]{
background:#eef;
}
</style>
</head>

<body>

<h1 id="classname"></h1>
<h2>Klassendienste</h2>

<button onclick="generate()">Neue Woche (zufällig)</button>
<button onclick="applyManual()">Manuell zuweisen</button>
<button onclick="goBack()">Zurück</button>

<!-- 🔹 DIENSTE ANZEIGE + DROPDOWNS -->

<div class="box">
Ordnungsdienst 1<br>
<span id="o1">-</span><br>
<select id="sel1"></select>
</div>

<div class="box">
Ordnungsdienst 2<br>
<span id="o2">-</span><br>
<select id="sel2"></select>
</div>

<div class="box">
Tafeldienst<br>
<span id="t">-</span><br>
<select id="sel3"></select>
</div>

<div class="box">
Blumendienst<br>
<span id="b">-</span><br>
<select id="sel4"></select>
</div>

<h2>Statistik</h2>
<table id="statsTable"></table>

<script>

let names=[]
let statsData={}
let history=[]

// 🔹 DATEN LADEN
function setData(data){

classname.textContent=data.klasse||""
names=(data.namen||"").split("\n").filter(n=>n)

statsData=data.stats||{}
history=data.history||[]

names.forEach(n=>{
if(!statsData[n]) statsData[n]={ord:0,tafel:0,blumen:0}
})

fillDropdowns()
drawStats()
}

// 🔹 DROPDOWNS
function fillDropdowns(){

let selects=["sel1","sel2","sel3","sel4"]

for(let s of selects){

let sel=document.getElementById(s)
sel.innerHTML="<option value=''>-- auswählen --</option>"

for(let n of names){
let opt=document.createElement("option")
opt.value=n
opt.text=n
sel.appendChild(opt)
}

}
}

// 🔹 STATISTIK (EDITIERBAR)
function drawStats(){

let html="<tr><th>Name</th><th>Ordnung</th><th>Tafel</th><th>Blumen</th><th>Gesamt</th></tr>"

names.forEach(n=>{
let s=statsData[n]
let total=s.ord+s.tafel+s.blumen

html+=`
<tr>
<td>${n}</td>
<td contenteditable data-n="${n}" data-t="ord">${s.ord}</td>
<td contenteditable data-n="${n}" data-t="tafel">${s.tafel}</td>
<td contenteditable data-n="${n}" data-t="blumen">${s.blumen}</td>
<td>${total}</td>
</tr>`
})

document.getElementById("statsTable").innerHTML=html

// 🔹 EDITIEREN
document.querySelectorAll("[contenteditable]").forEach(td=>{
td.oninput=()=>{
let n=td.dataset.n
let t=td.dataset.t
let val=parseInt(td.textContent)||0
statsData[n][t]=val
drawStats()
}
})

}

// 🔹 FAIRNESS
function pick(chosen){

let totals=names.map(n=>({
n,
t:statsData[n].ord+statsData[n].tafel+statsData[n].blumen
}))

let min=Math.min(...totals.map(x=>x.t))

let c=totals
.filter(x=>x.t===min)
.map(x=>x.n)
.filter(n=>!chosen.includes(n))

return c[Math.floor(Math.random()*c.length)]
}

// 🔹 AUTOMATISCH
function generate(){

let chosen=[]

let a=pick(chosen); chosen.push(a)
let b2=pick(chosen); chosen.push(b2)
let c=pick(chosen); chosen.push(c)
let d=pick(chosen); chosen.push(d)

assign(a,b2,c,d)
}

// 🔹 MANUELL
function applyManual(){

let a=sel1.value
let b2=sel2.value
let c=sel3.value
let d=sel4.value

let arr=[a,b2,c,d].filter(x=>x!="")

if(new Set(arr).size!==arr.length){
alert("Keine Doppelvergabe möglich")
return
}

assign(a,b2,c,d)
}

// 🔹 ZUWEISUNG
function assign(a,b2,c,d){

o1.textContent=a||"-"
o2.textContent=b2||"-"
t.textContent=c||"-"
b.textContent=d||"-"

if(a) statsData[a].ord++
if(b2) statsData[b2].ord++
if(c) statsData[c].tafel++
if(d) statsData[d].blumen++

drawStats()
}

// 🔹 ZURÜCK
function goBack(){

let data={
klasse:classname.textContent,
namen:names.join("\n"),
stats:statsData,
history:history
}

localStorage.setItem("tempData",JSON.stringify(data))
window.location.href="index.html"
}

// 🔹 INIT
window.onload=function(){
let data=localStorage.getItem("tempData")
if(data) setData(JSON.parse(data))
}

</script>

</body>
</html>
